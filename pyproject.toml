[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pdf-book-site"
version = "0.1.0"
description = "Local-first PDF book to Docusaurus converter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.12,<3",
  "pymupdf==1.28.0",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
docling = ["docling==2.116.0"]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
booksite = "booksite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/booksite"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

