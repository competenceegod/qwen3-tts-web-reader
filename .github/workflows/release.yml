name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install project
        run: uv sync --frozen --extra dev
      - name: Verify tag and extension version
        run: uv run --frozen python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Run tests
        run: uv run --frozen pytest
      - name: Run Ruff
        run: uv run --frozen ruff check .
      - name: Check extension JavaScript
        run: uv run --frozen python scripts/check_javascript.py
      - name: Check platform launchers
        run: uv run --frozen python scripts/check_launchers.py
      - name: Build audited release archives
        run: uv run --frozen python scripts/package_extension.py
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/SHA256SUMS.txt
          --verify-tag --generate-notes
          --title "Qwen3-TTS Web Reader $GITHUB_REF_NAME"
